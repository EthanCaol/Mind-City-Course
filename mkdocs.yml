site_name: 程序设计-课程实验文档
site_description: 复旦大学《程序设计》课程实验文档
site_url: https://mind-city.com/
docs_dir: docs

theme:
  name: material
  language: zh
  icon:
    logo: material/city
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  # 固定暗色。写成单个 scheme（而不是带 media 的列表）并且不给 toggle，
  # 顶栏就不会出现亮暗切换按钮，也不跟随系统偏好。
  palette:
    scheme: slate
    primary: indigo
    accent: indigo

nav:
  - 站点首页: index.md
  - 课程资料: material.md
  - 站点计划: plan.md
  - 作业:
      - 作业完成情况: homework/completion.md
      - 作业1：整数加法: homework/01-add.md
  - 实验课文档:
      - 文档阅读进度: setup/reading.md
      - 实用工具推荐: setup/useful.md
      - (0) Win11 必看教程: setup/win11.md
      - (1) Claude 工具链配置: setup/claude.md
      - (1) DSH 工具链配置: setup/dsh.md
      - (2) Dev-C++ 环境搭建: setup/dev-cpp.md
      - (2) WSL2 环境搭建: setup/wsl2.md
      - (2) macOS 环境搭建: setup/macos.md
      - (3) VSCode 入门教程: setup/vscode.md
      - (4) Linux 命令行基础: setup/linux-cli.md
      - (5) Git-GitHub 基础操作: setup/git-github.md
  - 题库:
      - 01-标识符常量与数据类型: question/01-identifiers-types.md
      - 02-格式化输入输出: question/02-format-io.md
      - 03-运算符表达式与求值顺序: question/03-operators.md
      - 04-控制结构: question/04-control-flow.md
      - 05-数组: question/05-arrays.md
      - 06-字符串与字符数组: question/06-strings.md
      - 07-函数递归与存储类别: question/07-functions-recursion.md
      - 08-预处理与宏: question/08-preprocessor-macros.md
      - 09-指针: question/09-pointers.md
      - 10-结构体与链表: question/10-structs-linked-list.md
      - 11-动态内存管理: question/11-dynamic-memory.md
      - 12-文件操作: question/12-file-io.md
      - 13-算法编程题: question/13-algorithms.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      # 保留中文锚点（默认会被转成 _1/_2 这类序号）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs       # 让 --8<-- "code/hello.c" 这种简写路径可用
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys          # ++ctrl+s++ 渲染成键帽样式
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: zh
  - glightbox:
      effect: none          # 关闭开/闭时的缩放动画，点击直接显示
  - git-revision-date-localized:
      type: timeago
      locale: zh
      enable_creation_date: false
      fallback_to_build_date: true
  - open-in-new-tab:
      add_icon: true        # 站外链接后面加一个小箭头图标
  # 构建时抓取外部资源（Google Fonts、站外图片）并本地化。
  # 学生无需访问 fonts.googleapis.com（内地不可达）。必须放在最后。
  - privacy

# 把「最后更新」提示从页底移到标题下方。见文件内的说明。
hooks:
  - hooks/revision_notice.py

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/extra.css

# 全站加载，但脚本开头会先找页面上的 #judge 元素，没有就直接退出 ——
# 只有「在线评测」那一页会真正干活。这样比在 markdown 里写内联 <script> 干净，
# 也避免 md_in_html 对脚本内容做意外处理。
extra_javascript:
  - assets/javascripts/judge.js

# 把锚点校验从默认的 info 提到 warn —— 否则写错 #锚点 只会打一行 INFO，
# --strict 不拦，站内交叉引用坏了也没人发现。
validation:
  links:
    anchors: warn
