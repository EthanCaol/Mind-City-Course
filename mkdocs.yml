site_name: 程序设计-课程实验文档
site_description: 复旦大学《程序设计》课程实验文档
site_url: https://mind-city.com/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: zh
  icon:
    logo: material/city
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 实验环境:
      - WSL2 + VSCode 环境搭建: setup/wsl2-vscode.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      # 保留中文锚点（默认会被转成 _1/_2 这类序号）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys          # ++ctrl+s++ 渲染成键帽样式
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: zh
  - glightbox:
      effect: none          # 关闭开/闭时的缩放动画，点击直接显示
  - git-revision-date-localized:
      type: timeago
      locale: zh
      enable_creation_date: false
      fallback_to_build_date: true
  # 构建时抓取外部资源（Google Fonts、站外图片）并本地化。
  # 学生无需访问 fonts.googleapis.com（内地不可达）。必须放在最后。
  - privacy

extra_css:
  - assets/stylesheets/fonts.css

# 把锚点校验从默认的 info 提到 warn —— 否则写错 #锚点 只会打一行 INFO，
# --strict 不拦，站内交叉引用坏了也没人发现。
validation:
  links:
    anchors: warn
